name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

# Cancel in-progress runs for previous commits on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── FRONTEND CI ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Audit dependencies (Security Scan)
        run: npm audit --audit-level=high
        continue-on-error: true # Prevents non-blocking advisories from halting the build

      - name: Build frontend
        run: npm run build

  # ─── BACKEND CI ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies & tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          pip install -r requirements.txt

      - name: Run Syntax Check (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ --exclude=backend/MarketDataFeedV3_pb2.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Security Scan (Bandit)
        run: |
          # Ignores generated Protobuf files and checks for high/medium security issues
          bandit -r backend/ -x backend/MarketDataFeedV3_pb2.py -ll

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

  # ─── DOCKER BUILD VALIDATION ──────────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build Validation
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Build
        run: |
          docker compose build --parallel
