services:
    postgres:
        build:
            context: .
            dockerfile: backend/postgres.Dockerfile
        image: candlesticks-postgres:dev
        container_name: candlesticks-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: candleticks
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5433:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d candleticks" ]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: candlesticks-redis
        restart: unless-stopped
        command: [ "redis-server", "--appendonly", "yes", "--requirepass", "linux123" ]
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: [ "CMD", "redis-cli", "-a", "linux123", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        image: candlesticks-python:dev
        container_name: candlesticks-backend
        restart: unless-stopped
        working_dir: /app/backend
        command: [ "python", "app.py" ]
        environment:
            PYTHONUNBUFFERED: "1"
            PYTHONDONTWRITEBYTECODE: "1"
            PGHOST: ${DOCKER_PGHOST:-postgres}
            PGPORT: ${DOCKER_PGPORT:-5432}
            PGDATABASE: ${DOCKER_PGDATABASE:-candleticks}
            PGUSER: ${DOCKER_PGUSER:-postgres}
            PGPASSWORD: ${DOCKER_PGPASSWORD:-postgres}
            DB_HOST: ${DOCKER_DB_HOST:-postgres}
            DB_PORT: ${DOCKER_DB_PORT:-5432}
            DB_NAME: ${DOCKER_DB_NAME:-candleticks}
            DB_USER: ${DOCKER_DB_USER:-postgres}
            DB_PASSWORD: ${DOCKER_DB_PASSWORD:-postgres}
            REDIS_URL: ${DOCKER_REDIS_URL:-redis://:linux123@redis:6379/10}
            UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
            UPSTOX_CLIENT_ID: ${UPSTOX_CLIENT_ID:-}
            UPSTOX_CLIENT_SECRET: ${UPSTOX_CLIENT_SECRET:-}
            UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-http://localhost/}
            SECRET_KEY: ${SECRET_KEY:-candlesticks_super_secret_key}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
    wsserver:
        image: candlesticks-python:dev
        container_name: candlesticks-wsserver
        restart: unless-stopped
        working_dir: /app/backend
        command: [ "python", "wsserver.py" ]
        environment:
            PYTHONUNBUFFERED: "1"
            PYTHONDONTWRITEBYTECODE: "1"
            REDIS_URL: ${DOCKER_REDIS_URL:-redis://:linux123@redis:6379/10}
            WS_HOST: 0.0.0.0
            WS_PORT: "9000"
            UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
            SKIP_SSL_VERIFY: ${SKIP_SSL_VERIFY:-0}
        ports:
            - "9000:9000"
        depends_on:
            redis:
                condition: service_healthy
    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        image: candlesticks-frontend:dev
        container_name: candlesticks-frontend
        restart: unless-stopped
        working_dir: /app/frontend
        volumes:
            - frontend_node_modules:/app/frontend/node_modules
        command: >
            sh -c " if [ ! -x ./node_modules/.bin/vite ]; then npm install --include=dev; fi && node ./node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173 "
        environment:
            NODE_ENV: development
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
            VITE_API_PROXY_TARGET: http://backend:8000
        ports:
            - "5173:5173"
        depends_on:
            - backend
            - wsserver

    nginx:
        build:
            context: .
            dockerfile: nginx/Dockerfile
        image: candlesticks-nginx:dev
        container_name: candlesticks-nginx
        restart: unless-stopped

        ports:
            - "80:80"
        depends_on:
            - frontend
            - backend
            - wsserver

volumes:
    pg_data:
    redis_data:
    frontend_node_modules:
